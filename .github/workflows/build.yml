name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    # GitHub 托管的 Apple Silicon (M 系列) runner
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 单元测试 (PhotoCore)
        run: swift test

      - name: 构建 (universal2: arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: 组装 .app 与 zip
        run: bash scripts/make-app-bundle.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTool-macOS-universal2
          path: dist/PhotoTool-macOS-universal2.zip

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/PhotoTool-macOS-universal2.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes
